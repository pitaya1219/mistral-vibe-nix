name: Sync rusty_v8 pin

on:
  # flake.lock moving is what bumps mistral-vibe-src, and with it the v8 crate
  # the pin has to match -- so that is the real trigger. The schedule is only
  # there to catch a lock that was updated some other way.
  #
  # Only on main: the job checks main out rather than the pushed ref, so a
  # branch push would run it against a tree that push is not in, and could
  # open a PR for something the pusher never touched.
  push:
    branches:
      - main
    paths:
      - 'flake.lock'
      - 'rusty-v8.nix'
      - 'update-rusty-v8.py'
  schedule:
    - cron: '0 4 * * 1'  # Every Monday at 4:00 AM
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-rusty-v8:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          repository: ${{ gitea.repository }}
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Configure git
        run: |
          git config user.name "gitea-actions[bot]"
          git config user.email "gitea-actions[bot]@noreply.git.pitaya.f5.si"

      - name: Refresh the pin
        run: ./update-rusty-v8.py

      - name: Check for changes and create PR
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GITEA_SERVER_URL: ${{ gitea.server_url }}
          REPO: ${{ gitea.repository }}
        run: |
          if git diff --quiet rusty-v8.nix; then
            echo "rusty-v8.nix already matches the v8 crate"
            exit 0
          fi

          echo "=== Changes detected, creating PR ==="
          git diff rusty-v8.nix

          BRANCH="chore/sync-rusty-v8-pin"
          git checkout -B "$BRANCH"
          git add rusty-v8.nix
          git commit -m "chore: Sync the rusty_v8 pin with the v8 crate."
          git push -f origin "$BRANCH"

          EXISTING_PR=$(curl -s \
            -H "Authorization: token ${BOT_TOKEN}" \
            "${GITEA_SERVER_URL}/api/v1/repos/${REPO}/pulls?state=open")

          if echo "$EXISTING_PR" | grep -q "\"ref\":\"${BRANCH}\""; then
            echo "PR from ${BRANCH} already exists, force-pushed to it instead"
            exit 0
          fi

          # The pin and the crate disagreeing is an evaluation failure on every
          # system (see the assert in flake.nix), so say what is broken rather
          # than describing this as routine housekeeping.
          RESPONSE=$(curl -s -w "\nHTTP_CODE:%{http_code}" -X POST \
            -H "Authorization: token ${BOT_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{
              "title": "chore: Sync the rusty_v8 pin with the v8 crate",
              "body": "The v8 crate in `harness/core/Cargo.lock` moved, so the prebuilt rusty_v8 archives in `rusty-v8.nix` no longer match it and the flake refuses to evaluate.\n\nRegenerated by `./update-rusty-v8.py` from `.gitea/workflows/rusty-v8-sync.yml`. The hashes come from `nix-prefetch-url` against the release the crate would have fetched itself.",
              "head": "'"$BRANCH"'",
              "base": "main"
            }' \
            "${GITEA_SERVER_URL}/api/v1/repos/${REPO}/pulls")
          echo "API Response: $RESPONSE"
